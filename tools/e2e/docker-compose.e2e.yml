# Dedicated, disposable e2e stack. Own compose project (`tallyline-e2e`), own
# volumes (none: tmpfs), and non-default host ports so it can never collide
# with, or be mistaken for, the dev stack in the repo-root docker-compose.yml
# (Postgres :5432 / Redis :6380).
name: tallyline-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tallyline_e2e
    ports:
      - "127.0.0.1:${E2E_PG_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tallyline_e2e"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${E2E_REDIS_PORT:-56380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
